name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  actionlint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.4

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumeforge
          POSTGRES_PASSWORD: resumeforge
          POSTGRES_DB: resumeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeforge -d resumeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://resumeforge:resumeforge@localhost:5432/resumeforge
      APP_ACCESS_SECRET: ci-access-secret-not-a-user-password
      JOB_SYNC_SECRET: ci-sync-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!package-lock.json'; then
            echo "Unresolved merge conflict markers found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Env parity
        run: npm run check:env

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: PostgreSQL integration
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_RESUME_LAYOUT_V2: "true"

      - name: Install Chromium for resume render checks
        run: npx playwright install --with-deps chromium

      - name: Resume rendering and export gates
        run: npx playwright test --config playwright.resume-layout-v2.config.ts

      - name: Preserve resume render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-layout-v2-renders
          path: test-results/resume-layout-v2
          if-no-files-found: ignore
