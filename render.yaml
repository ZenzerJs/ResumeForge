services:
  - type: web
    name: resumeforge
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: resumeforge-db
          property: connectionString
      - key: APP_ACCESS_SECRET
        generateValue: true
      - key: JOB_SYNC_SECRET
        generateValue: true

databases:
  - name: resumeforge-db
    plan: basic_256mb
    postgresMajorVersion: "16"
